name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # job id 保持 `smoke` 不变：分支保护里的 required status check 认的是这个 id，
  # 改名会让保护规则指向一个不存在的检查。内容已不止 smoke，见下面的 step 说明。
  smoke:
    runs-on: ubuntu-latest
    # PR-001 的证据链测试大量做 KDF，全量单测本身就要一个多小时。给足额度，
    # 但不要给到 GitHub 默认的 6 小时——真挂住时应该在两个多小时内被看见。
    timeout-minutes: 150
    steps:
      # PR-001 的 release gate 会按 as-of commit 解析历史证据；默认 depth=1
      # 会让同一份工作树缺失祖先提交而把历史判为不可验证。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # 仓库的 Python 版本闸在 scripts/cwk_doctor.py（MIN_PYTHON = 3.10），
          # 实际开发与验收基线是 3.11。
          python-version: "3.11"
      - name: Repo checks (same entry point as local `make ci`)
        # 和本地同一条命令：make ci = make test + make aodw-check + make governance-audit。
        # 覆盖 doctor、py_compile、全量单测、三个脱敏 smoke、AODW 框架 fixture、
        # 受管 RT 门禁、RT 花名册一致性、以及当前代码树的归属与演化管辖自检。
        # 两边命令必须一致——命令不同的话，「CI 是绿的」在本地就不可复现，
        # 也就不能当验收证据。
        #
        # 这一步同时是 DI-003 的补偿控制（见 code-ownership-manifest.json 的 EX-001）：
        # 本仓库无法安全安装 pre-commit hook，CI 就是权威门。governance-audit 会
        # 反向校验这一行确实在跑 make ci——把它改掉，门自己会红。
        run: make ci
