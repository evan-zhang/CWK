# RAG + LLM-Wiki 配置文件

storage:
  mysql:
    host: ${MYSQL_HOST:-127.0.0.1}
    port: ${MYSQL_PORT:-3306}
    user: ${MYSQL_USER:-root}
    password: ${MYSQL_PASSWORD:-}
    database: ${MYSQL_DB:-wiki}
    charset: utf8mb4

vector_store:
  elasticsearch:
    scheme: ${ES_SCHEME:-http}
    host: ${ES_HOST:-127.0.0.1}
    port: ${ES_PORT:-9200}
    user: ${ES_USER:-}
    password: ${ES_PASSWORD:-}
    index: ${ES_INDEX:-wiki_chunks}
    embed_dims: ${ES_EMBED_DIMS:-1024}        # 必须与 embedding 模型输出维度一致
    analyzer: ${ES_ANALYZER:-standard}        # 生产环境用 ik_max_word；本地如无 IK 插件回退 standard
    similarity: cosine

embedding:
  model: ${EMBEDDING_MODEL:-text-embedding-v4}
  api_key: ${EMBEDDING_API_KEY:-}
  base_url: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  dims: ${ES_EMBED_DIMS:-1024}

ai:
  url: ${AI_URL:-}
  user_key: ${AI_USER_KEY:-}
  model_type: ${AI_MODEL_TYPE:-qwen-max}
  temperature: ${AI_TEMPERATURE:-0.1}
  biz_code: ${AI_BIZ_CODE:-aiwiki_v3}
  max_output_tokens: ${AI_MAX_OUTPUT_TOKENS:-2048}
  json_mode: ${AI_JSON_MODE:-1}

ingest:
  chunk_size: ${CHUNK_SIZE:-800}
  chunk_overlap: ${CHUNK_OVERLAP:-120}
  status_active: 1

semantic_card:
  enabled: false            # L1 语义卡（本里程碑预留，不做全量 judge）

knowledge_compilation:
  enabled: true             # L2 Wiki 编译
  model: ${AI_MODEL_TYPE:-qwen-max}
  quality_gate:
    min_source_coverage: 0.9
    min_pass1_precision: 0.8
    require_conflict_parallel: true
    require_grant_computable: true

clustering:
  enabled: false            # L1 分类/聚类（本里程碑预留）

qa:
  top_k: ${TOP_K:-6}
  bm25_weight: ${BM25_WEIGHT:-0.3}
  vector_weight: ${VECTOR_WEIGHT:-0.7}
  confidence_threshold: 0.3

grant:
  actions: [ask, read, cite]
  acl_cache_ttl_seconds: ${ACL_CACHE_TTL:-300}
  revoke_invalidation: true

topic_router:
  enabled: false            # Topic Router（后续迭代）

invalidation:
  on_revoke_bump_acl_revision: true
  invalidate_user_projection_cache: true
  block_claim_from_llm: true
  async_reindex_wiki: true
