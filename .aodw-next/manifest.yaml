# AODW 自带的 skill。源码随 .aodw-next/ 一起分发；各家 AI 工具从宿主目录
# （.agent/skills/ 或 .claude/skills/）发现 skill，故需安装一次：
#     bash .aodw-next/tools/install-skills.sh
# 安装用符号链接，源码只有一份、改了立刻生效。详见 06-project/ai-init-prompt.md。
skills:
  - id: handover-pack
    name: Handover Pack
    path: skills/handover-pack/SKILL.md
    summary: >
      把当前会话的工作整理成规范交接包（写明当前 RT、与转出台账建立关联、
      带标准 frontmatter），产出落 docs/handover/。用户说「帮我做好交接工作」时调用。
    validator: skills/handover-pack/scripts/validate.py
