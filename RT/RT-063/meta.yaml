notes: >
  管理控制台入口原来只在首页最底部的"管理员入口"一节，用户常常找不到。
  在所有页面（首页、文档中心、各文档页）的顶部导航右侧放一个醒目的"管理控制台"入口；
  底部那一节保留。窄屏下入口也必须在首屏可见，不能被横向滚动藏起来。
  2026-09-18 产品负责人确认上线效果后关闭。
