# RT Index — CWK
#
# RT 花名册。两个消费者：
#   1. 编号（`.aodw-next/02-workflow/rt-manager.md`「编号」）：新 RT 取本文件与
#      `RT/` 目录条目的并集，最大序号 +1。只扫目录会撞号，所以本文件必须齐全。
#   2. AODW 门禁 `.aodw-next/tools/rt-guard.sh`：G109 按 `- id: RT-XXX` 行认条目；
#      G111 收口复盘 Gate 按条目内的 `backfill` 键判存量。
#
# 格式（RT-029 收敛）：本文件此前扩展名是 .yaml、内容却是 Markdown 表格，rt-guard
# 解析不了，结果仓库里每个 RT 都恒报一条 G109 告警，G111 的存量豁免也无从生效。
# 本次改成真正的 YAML，字段与原表格一一对应，没有改动任何 RT 自己的文档。
#
# backfill: aodw-adoption
#   该 RT 在 AODW 接入（2026-08-31）之前就存在，只作历史证据，不是门禁对象。
#   这是 AODW 自带的存量标记机制（G111 据此豁免），不是为放行而开的例外。
#   接入后新建的 RT 一律不带此键，必须走完整门禁。

