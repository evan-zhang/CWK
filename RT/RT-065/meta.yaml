notes: >
  不做独立用户名密码体系。提供加密报到通道与很薄的控制台登录态：同事用本人业务 Key
  经玄关核实后进入人员目录，浏览器会话绑定人员主体。为后续成员管理页、切 grants、
  自助建库铺路。身份铁律不变——只认当场核实的 Key，禁止手填身份。
