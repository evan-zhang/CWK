notes: >
  方案重规划中。2026-09-09 基于三库实测体量、100–200 倍目标容量、1000 倍演进上限、
  公网 Gateway 需求及 WeKnora 源码审查，目标架构收敛为 PostgreSQL 控制面、OpenSearch
  检索面、NAS/S3 对象层、内网只读 Connector 与统一 Query API。旧 bounded-read/P0
  实现与 evidence 保留，但“大 JSON 快照/P1b”不再是目标架构。用户于 2026-09-09
  通过方案门；阶段 A 已冻结三库证据基线、72 题 gold、v2/v3 合同及要求去留，独立复核通过。
  阶段 B 已完成本地离线 Parent/Child、scoped BM25、50-doc OpenSearch fixture benchmark，及 OPS
  三库原地 benchmark。真实三库共 704 个可索引文档投影为 13,160 Parents / 52,136 Children；
  ICU/SmartCN 相对各库旧 lexical JSON 均缩小 94.920%–97.329%，shared physical index 的 90 次
  kb_id filter probe 零串库。OPS 无可安全识别且带 legacy 基线的人工固定 gold，case=0，故真实
  Recall@10、exact Top10、no-answer 均 UNKNOWN；不以仓库合成 72 题冒充。最终 NO-GO，analyzer/
  mapping 不固定，RT 保持 in-progress，不进入阶段 C。临时索引、容器、派生镜像和 workdir 已归零，
  3 个生产 Gateway 与旧索引元数据摘要未变；未部署数据库，未修改 Gateway、NAS、旧索引或生产配置。
