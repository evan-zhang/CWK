notes: >
  发令牌是试跑前最后一个还要敲命令的环节。页面化时守住 RT-047 的铁律：
  身份只能由当场核实的 Key 推导，所以不做"管理员替别人签"，而是本人登录后
  再当场核实一次 Key、签给自己。管理员可以看全部令牌元数据并紧急吊销，但签不出别人的令牌。
