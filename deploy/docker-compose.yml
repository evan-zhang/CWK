services:
  opensearch:
    build:
      context: ..
      dockerfile: deploy/opensearch.Dockerfile
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  retrieval:
    build:
      context: ..
      dockerfile: deploy/retrieval.Dockerfile
    environment:
      CWK_OPENSEARCH_URL: http://opensearch:9200
      CWK_OPENSEARCH_INDEX: ${CWK_OPENSEARCH_INDEX:-cwk-retrieval-v1}
      CWK_OPENSEARCH_TIMEOUT: ${CWK_OPENSEARCH_TIMEOUT:-10}
      CWK_OPENSEARCH_USERNAME: ${CWK_OPENSEARCH_USERNAME:-}
      CWK_OPENSEARCH_PASSWORD: ${CWK_OPENSEARCH_PASSWORD:-}
      CWK_RETRIEVAL_HOST: 0.0.0.0
      CWK_RETRIEVAL_PORT: 8787
      CWK_RETRIEVAL_TENANT: ${CWK_RETRIEVAL_TENANT:-default}
      CWK_RETRIEVAL_BANKS: ${CWK_RETRIEVAL_BANKS:-cwork-3m,docdb-touqian,spbp-2027}
      CWK_RETRIEVAL_TOP_K: ${CWK_RETRIEVAL_TOP_K:-10}
      RAG_AUTH_ENABLED: ${RAG_AUTH_ENABLED:-false}
      RAG_AUTH_REGISTRY: ${RAG_AUTH_REGISTRY:-}
      RAG_AUTHZ_MODE: ${RAG_AUTHZ_MODE:-scope}
      RAG_AUTHZ_PATH: ${RAG_AUTHZ_PATH:-}
    ports:
      - "${KB_BIND_ADDR:-127.0.0.1}:${RETRIEVAL_PORT:-8787}:8787"
    depends_on:
      opensearch:
        condition: service_healthy

  rag-answer:
    build:
      context: ..
      dockerfile: deploy/rag.Dockerfile
    environment:
      RAG_HOST: 0.0.0.0
      RAG_RETRIEVAL_URL: ${RAG_RETRIEVAL_URL:-http://host.docker.internal:18887/query}
      RAG_BANK: ${RAG_BANK:-cwork-3m}
      RAG_RETRIEVAL_TIMEOUT_SECONDS: ${RAG_RETRIEVAL_TIMEOUT_SECONDS:-10}
      RAG_SOURCE_ROOTS: ${RAG_SOURCE_ROOTS:-/data/sources}
      RAG_DOC_INDEX: ${RAG_DOC_INDEX:-/data/index.json}
      RAG_LLM_URL: ${RAG_LLM_URL:-http://host.docker.internal:11434/v1/chat/completions}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-60}
      RAG_AUTH_ENABLED: ${RAG_AUTH_ENABLED:-false}
      RAG_AUTH_REGISTRY: ${RAG_AUTH_REGISTRY:-}
      RAG_AUTHZ_MODE: ${RAG_AUTHZ_MODE:-scope}
      RAG_AUTHZ_PATH: ${RAG_AUTHZ_PATH:-}
    ports:
      - "${KB_BIND_ADDR:-127.0.0.1}:${RAG_PORT:-8790}:8790"
    volumes:
      - ${RAG_SOURCE_DIR:-./rag-sources}:/data/sources:ro
      - ${RAG_INDEX_FILE:-./rag-index.json}:/data/index.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  opensearch-data:
